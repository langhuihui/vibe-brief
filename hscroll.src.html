<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Vibe Coding 简史 · 横卷</title>
<style>
/*STORY_CSS*/
</style>
<style>
/* =====================================================================
   横卷版 · horizontal side-scroller
   Everything above comes verbatim from story.src.html (scenes, posters).
   This sheet re-stages it as a level:
     y   0– 66  HUD          y  70–148  热议 弹幕 (sky)
     y  76–784  stage sets, gates, actors (hologram screen + speech bubble)
     y 794–872  the cast: NPC per logo / person, hero + vehicle
     y 873–903  the road = Cursor (width = valuation)
     y 904–1004 time ruler   y1012–1068 minimap + autoplay
   ===================================================================== */
html,body{overscroll-behavior:none}
/* the stage must never scroll internally (content reaches past its edges on purpose) */
#stage{overflow:hidden;overflow:clip;overflow-anchor:none}
#L0{z-index:1}#L1{z-index:2}#gbg{z-index:3}#LG{z-index:4}#nowl{z-index:4}#L2{z-index:5}#LN{z-index:6;pointer-events:none}
#nowr{z-index:6}#cdm{z-index:7}#hero{z-index:8}#sky{z-index:8}#hint{z-index:8}#hud,#toast,#mm,#auto{z-index:9}
.blk{transform-origin:0 0}

/* ---------- far / mid scenery ---------- */
.stars{position:absolute;top:0;height:560px;opacity:.5;pointer-events:none;
  background-image:radial-gradient(1.4px 1.4px at 23px 41px,rgba(255,255,255,.75),transparent),radial-gradient(1px 1px at 141px 97px,rgba(255,255,255,.5),transparent),radial-gradient(1.2px 1.2px at 211px 13px,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 77px 151px,rgba(255,255,255,.45),transparent),radial-gradient(1.6px 1.6px at 180px 170px,rgba(186,230,253,.6),transparent);
  background-size:260px 190px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.ridge{position:absolute;overflow:hidden;pointer-events:none}
.hyr{position:absolute;white-space:nowrap;pointer-events:none}
.hyr b{display:block;font:900 360px/1 var(--sans);letter-spacing:-.06em;color:transparent;-webkit-text-stroke:2px var(--c);opacity:.13}
.hyr span{display:block;font:800 56px var(--sans);color:var(--c);opacity:.22;margin:-10px 0 0 16px}
.hrole{position:absolute;font:900 84px/1 var(--sans);letter-spacing:-.03em;color:#fff;opacity:.035;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.hrole.on{opacity:.14}
.hrole small{display:block;font:700 18px var(--mono);letter-spacing:.2em;margin-bottom:10px}

/* ---------- ground: road (Cursor), flags, ruler ---------- */
#gbg{position:absolute;left:0;top:866px;width:1920px;height:214px;background:linear-gradient(180deg,rgba(6,8,12,0),#06080c 36px,#04060a);pointer-events:none}
.road{position:absolute;top:858px;height:60px;overflow:visible;pointer-events:none}
.soil{position:absolute;top:903px;height:120px;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 48px),linear-gradient(180deg,rgba(255,255,255,.035),transparent 70%)}
.rk{position:absolute;top:905px;width:1px;height:8px;background:rgba(255,255,255,.3)}
.rk.y{width:2px;height:22px;background:var(--c);box-shadow:0 0 8px var(--c)}
.rk.w{height:4px;background:rgba(255,255,255,.16)}
.rm{position:absolute;top:915px;font:600 12px var(--mono);color:#6b7487;white-space:nowrap}
.rd{position:absolute;top:912px;font:500 10px var(--mono);color:#454d5e}
.ry{position:absolute;top:911px;font:800 26px/1 var(--mono);letter-spacing:-.02em;white-space:nowrap}
.ry small{font-size:15px;opacity:.7}
.rph{position:absolute;top:946px;height:16px;border-radius:4px;background:color-mix(in srgb,var(--c) 16%,transparent);border-left:3px solid var(--c);font:700 11px/16px var(--mono);letter-spacing:.08em;color:var(--c);padding-left:8px;white-space:nowrap;overflow:hidden}
.rcm{position:absolute;top:883px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:#07090d;border:2px solid var(--c)}
.rcm.big{top:881px;width:14px;height:14px;margin-left:-7px;background:var(--c);box-shadow:0 0 12px var(--c)}
.rcl{position:absolute;font:600 13px var(--mono);color:#9aa5b8;white-space:nowrap}
.rcl em{font-style:normal;color:var(--c);margin-right:6px}
.rcl.big{color:#fff;font-weight:800}
.rch{position:absolute;top:908px;height:10px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-top:none;border-radius:0 0 6px 6px}
.rch b{position:absolute;left:10px;top:14px;right:0;font:700 13px var(--mono);color:#8b93a7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnow{position:absolute;top:836px;height:72px;width:0;border-left:2px dashed rgba(255,255,255,.75)}
.rnow b{position:absolute;left:8px;top:-2px;font:800 13px var(--mono);color:#07090d;background:#fff;padding:2px 8px;border-radius:999px;white-space:nowrap}
.flag{position:absolute;top:800px;height:86px;width:3px;border-radius:2px;background:linear-gradient(#e2e8f0,#475569)}
.flag::before{content:"";position:absolute;left:-4px;top:-8px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.flag b{position:absolute;left:3px;top:4px;padding:4px 18px 4px 9px;font:800 12px var(--mono);letter-spacing:.12em;color:#07090d;background:var(--c);clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%);white-space:nowrap;transform-origin:left center;transform:scaleX(.25);opacity:.45;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .4s}
.flag.up b{transform:none;opacity:1}
.flag.goal b{padding:6px 22px 6px 12px;font-size:14px}

/* ---------- vehicles (hero + power-up icons share the drawing) ---------- */
.veh .wh circle{fill:#0b0f16;stroke:#cbd5e1;stroke-width:3}
.veh .wh path{fill:none;stroke:#64748b;stroke-width:1.6}
.veh .fr{fill:none;stroke:var(--era);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.veh .crk path{stroke:#e2e8f0;stroke-width:3;stroke-linecap:round}
.veh .cb{fill:color-mix(in srgb,var(--era) 78%,#0b0f16);stroke:color-mix(in srgb,var(--era) 50%,#fff);stroke-width:1.5}
.veh .cs{stroke:rgba(255,255,255,.45);stroke-width:2}
.veh .hl{fill:#fde68a}
.veh .sb{fill:#d7dee9;stroke:#fff;stroke-width:1}
.veh .sf{fill:var(--era)}
.veh .ss{stroke:var(--era);stroke-width:4;stroke-linecap:round}
.veh .sl{fill:#fff}
.veh .hbd{fill:#6b4a2f;stroke:color-mix(in srgb,var(--era) 55%,#fff);stroke-width:1.5;stroke-linejoin:round}
.veh .hlg path{fill:none;stroke:#6b4a2f;stroke-width:6;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 0}
.veh .hlg.f path{stroke:#4a3220}
.veh .hmn,.veh .htl{fill:none;stroke:#2b1a0e;stroke-width:4.5;stroke-linecap:round}
.veh .hsd{fill:var(--era)}
.veh .hey{fill:#0b0f16}
.veh .hrn{fill:none;stroke:#e2e8f0;stroke-opacity:.6;stroke-width:1.2}

/* ---------- period scenery: 2023 古代 · 2024 近代 · 2025 现代 · 2026 未来 ----------
   silhouettes in the mid layer (dark fill, year-colour outline, period accent lights) */
.scn{position:absolute;top:560px;height:340px;overflow:visible;pointer-events:none}
.scn.zbk{opacity:.4}
.scn .zb{fill:#0a0e15;stroke:var(--c);stroke-opacity:.42;stroke-width:1.6;stroke-linejoin:round}
.scn .zp{stroke:none}
.scn .zd{fill:none;stroke:var(--c);stroke-opacity:.3;stroke-width:1.3;stroke-linecap:round}
.scn .zl{fill:none;stroke:var(--c);stroke-opacity:.45;stroke-width:2.6;stroke-linecap:round}
.scn .zw{fill:var(--c);opacity:.75}
.scn .zg{fill:#fbbf24;opacity:.6}.scn .zg.zlo{opacity:.16}
.scn .zlan{fill:#f97316;opacity:.8}
.scn .zgate{fill:#fbbf24;opacity:.12}
.scn .zglow{fill:#fbbf24;opacity:.1}
.scn .zsm{fill:#94a3b8;opacity:.07}
.scn .zface{fill:#fef3c7;fill-opacity:.38;stroke:var(--c);stroke-opacity:.5}
.scn .zhand{stroke:#0a0e15;stroke-width:1.8;stroke-linecap:round}
.scn .zwire{fill:none;stroke:var(--c);stroke-opacity:.2;stroke-width:1}
.scn .zwo{fill:none;stroke:var(--c);stroke-opacity:.45;stroke-width:11;stroke-linecap:round}
.scn .zwh{fill:none;stroke:#0a0e15;stroke-width:8;stroke-linecap:round}
.scn .zrl{fill:#f87171;opacity:.85}
.scn .zcw,.scn .zcr{fill:none;stroke-width:2.5;stroke-linecap:round;stroke:#f8fafc;stroke-opacity:.6}.scn .zcr{stroke:#f87171}
.scn .zws{fill:none;stroke:#f8fafc;stroke-opacity:.35;stroke-width:2;stroke-dasharray:2 3}
.scn .zbl{fill:none;stroke:color-mix(in srgb,var(--c) 50%,#e2e8f0);stroke-opacity:.5;stroke-width:3;stroke-linecap:round}
.scn .zn{fill:none;stroke:var(--c);stroke-opacity:.7;stroke-width:2}
.scn .znl{fill:none;stroke:#67e8f9;stroke-opacity:.55;stroke-width:1.5;stroke-linecap:round}
.scn .ztip{fill:#a7f3d0}
.scn .ztube{fill:none;stroke:var(--c);stroke-opacity:.2;stroke-width:9;stroke-linecap:round}
.scn .zpod{fill:#e0f2fe;opacity:.8}
.scn .ztrail{fill:none;stroke:#67e8f9;stroke-opacity:.3;stroke-width:2;stroke-linecap:round}
.scn .zhb{fill:color-mix(in srgb,#e879f9 8%,transparent);stroke:#e879f9;stroke-opacity:.6;stroke-width:1.5}
.scn .zhl{fill:none;stroke:#f0abfc;stroke-opacity:.5;stroke-width:2.5;stroke-linecap:round}
.scn .zglw{fill:var(--c);opacity:.18}
.fp{position:absolute;overflow:visible;pointer-events:none}
.fp.spin{animation:wSpin 90s linear infinite}
/* ---------- 回望: indoors — an opaque room in the mid layer hides the sky behind it ---------- */
.inr{position:absolute;top:0;height:905px;overflow:visible;pointer-events:none}
.inr .ib{fill:#141a24;stroke:var(--c);stroke-opacity:.28;stroke-width:1.5;stroke-linejoin:round}
.inr .ik{fill:#0b0f16;stroke:#2a3342;stroke-width:1.5}
.inr .id{fill:none;stroke:var(--c);stroke-opacity:.3;stroke-width:1.3;stroke-linecap:round}
.inr .if{fill:none;stroke:#b08d57;stroke-opacity:.75;stroke-width:6}
.inr .iw{fill:url(#zng)}
.inr .im{fill:none;stroke:#1b2230;stroke-width:7}
.inr .ist{fill:#fff;opacity:.55}
.inr .isk{fill:#070b12}
.inr .ilt{fill:#67e8f9;opacity:.55}
.inr .icu{fill:var(--c);opacity:.1}
.inr .icn{fill:url(#zcone)}
.inr .iglo{fill:#fde68a;opacity:.14}
.inr .ibulb{fill:#fde68a;opacity:.9}
.inr .ilf{fill:#1f6f4a;opacity:.8}
.inr .icap{font:700 12px var(--mono);letter-spacing:.12em;fill:#8b93a7}
.inr .ikey{font:800 17px var(--mono);fill:#e2e8f0}
.inr .ineo{font:900 46px var(--sans);letter-spacing:.02em}
.inr .ineo.u{fill:none;stroke:var(--c);stroke-opacity:.22;stroke-width:9}
.inr .ineo.t{fill:var(--c);opacity:.9}
.inr .isn{font:800 22px var(--sans);letter-spacing:.3em;fill:#fde68a}
.infloor{position:absolute;top:903px;height:120px;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(176,141,87,.12) 0 2px,transparent 2px 150px),linear-gradient(180deg,rgba(176,141,87,.14),transparent 80%)}

/* ---------- hero ---------- */
#nowl{position:absolute;left:639px;top:66px;width:2px;height:806px;pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.05) 10%,rgba(255,255,255,.05) 80%,color-mix(in srgb,var(--era) 50%,transparent))}
#nowr{position:absolute;left:638px;top:903px;width:3px;height:100px;pointer-events:none;background:linear-gradient(var(--era),transparent);box-shadow:0 0 10px var(--era)}
/* local box 48×66, feet at y=66 (stage y 872) */
#hero{position:absolute;left:616px;top:806px;width:48px;height:66px;pointer-events:none;transition:transform 1.3s cubic-bezier(.55,0,.85,.35),opacity 1.1s}
#hero.gone{transform:translate(520px,-820px) rotate(-14deg);opacity:0}
#hero .hf,#hero .hw,#hero .hv{position:absolute;inset:0}
#hero .hf{transition:transform .18s}
#hero.back .hf{transform:scaleX(-1)}
#hero .hv>*{position:absolute}
#hero .hbw{left:0;top:0;width:48px;height:48px;transform-origin:0 0;z-index:2;transition:transform .3s}
#hero .hb{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#222c3c,#0b0f16);border:2px solid var(--era);box-shadow:0 0 0 4px color-mix(in srgb,var(--era) 14%,transparent),0 0 26px color-mix(in srgb,var(--era) 55%,transparent);animation:hIdle 2.2s ease-in-out infinite;transition:border-color .4s,box-shadow .4s}
#hero .hb .lg{width:32px;height:32px;background:none;border:none}
#hero .hb .lg svg{width:28px;height:28px}
#hero .harm{position:absolute;left:43px;top:20px;width:8px;height:19px;border-radius:4px;background:#cbd5e1;transform-origin:50% 3px;transform:rotate(-16deg);transition:transform .22s cubic-bezier(.3,1.7,.5,1)}
#hero.hi5 .harm{transform:rotate(-158deg)}
#hero .leg{top:44px;width:9px;height:16px;border-radius:3px 3px 5px 5px;background:#cbd5e1;transform-origin:50% 0}
#hero .leg.l{left:11px}#hero .leg.r{left:28px}
#hero .dust{left:-16px;top:52px;width:10px;height:10px;border-radius:50%;background:rgba(203,213,225,.4);opacity:0}
#hero .sh{position:absolute;left:2px;top:60px;width:44px;height:9px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.8),transparent 70%);transition:all .3s}
#hero .vhorse,#hero .vbike,#hero .vcar,#hero .vship,#hero .vdome,#hero .flame,#hero .hglow,#hero .hbeam,#hero .puff{display:none}
#hero .vhorse{left:-34px;top:2px;width:110px;height:66px;z-index:1;overflow:visible}
#hero .vbike{left:-22px;top:16px;width:92px;height:52px;z-index:1;overflow:visible}
#hero .vcar{left:-44px;top:18px;width:140px;height:50px;z-index:3;overflow:visible}
#hero .vship{left:-52px;top:-8px;width:150px;height:60px;z-index:1;overflow:visible}
#hero .vdome{left:8px;top:-8px;width:44px;height:44px;z-index:3;fill:rgba(160,220,255,.14);stroke:rgba(220,240,255,.75);stroke-width:2}
#hero .vdome path{fill:none;stroke:rgba(255,255,255,.7);stroke-width:2.5;stroke-linecap:round}
#hero .hbeam{left:92px;top:28px;width:130px;height:38px;background:linear-gradient(90deg,rgba(253,230,138,.38),transparent);clip-path:polygon(0 30%,100% 0,100% 100%,0 70%)}
#hero .puff{left:-58px;top:46px;width:14px;height:14px;border-radius:50%;background:rgba(203,213,225,.45);opacity:0}
#hero .flame{left:-92px;top:14px;width:52px;height:16px;border-radius:50%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--era) 70%,transparent) 40%,#fde68a 80%,#fff);filter:blur(1px);transform-origin:100% 50%;animation:hFlame .12s ease-in-out infinite alternate}
#hero .hglow{left:-14px;top:38px;width:76px;height:52px;background:linear-gradient(180deg,color-mix(in srgb,var(--era) 30%,transparent),transparent);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
#hero .poof{position:absolute;left:-26px;top:-20px;width:100px;height:100px;border-radius:50%;border:4px solid var(--era);opacity:0;pointer-events:none}
#hero.pw .poof{animation:hPoof .6s ease-out}
#hero.pw .hv{animation:hPw .6s ease-out}
#hero .pmsg{position:absolute;left:24px;top:-34px;transform:translateX(-50%);font:900 18px var(--sans);color:#fff;white-space:nowrap;text-shadow:0 0 12px var(--era),0 2px 0 #000;opacity:0}
#hero.pw .pmsg{animation:hMsg 1.6s ease-out}
#hero[data-v=horse] .vhorse,#hero[data-v=bike] .vbike,#hero[data-v=car] .vcar,#hero[data-v=car] .hbeam,#hero[data-v=car] .puff,#hero[data-v=ship] .vship,#hero[data-v=ship] .vdome,#hero[data-v=ship] .flame,#hero[data-v=ship] .hglow{display:block}
#hero:not([data-v=walk]) .leg,#hero:not([data-v=walk]) .dust{display:none}
#hero[data-v=horse] .hbw{transform:translate(-2px,-13px) scale(.7)}
#hero[data-v=horse] .sh{left:-32px;width:108px}
#hero.run[data-v=horse] .hv{animation:hGb .36s ease-in-out infinite}
#hero[data-v=bike] .hbw{transform:translate(4px,-12px) scale(.833) rotate(5deg)}
#hero[data-v=car] .hbw{transform:translate(12px,8px) scale(.667)}
#hero[data-v=car] .sh{left:-42px;width:136px}
#hero[data-v=ship] .hbw{transform:translate(16px,0) scale(.583)}
#hero[data-v=ship] .hv{animation:hHover 1.8s ease-in-out infinite}
#hero[data-v=ship] .sh{left:6px;width:36px;opacity:.5}
#hero[data-v=car] .hv{animation:hVib .18s linear infinite}
#hero.run .hb{animation:hBob .3s ease-in-out infinite}
#hero.run .leg.l{animation:hLeg .3s linear infinite}
#hero.run .leg.r{animation:hLeg .3s linear -.15s infinite}
#hero.run .dust{animation:hDust .3s linear infinite}
#hero.run .wh{animation:wSpin .32s linear infinite}
#hero.run .crk{animation:wSpin .5s linear infinite}
#hero.run .puff{animation:hPuff .5s linear infinite}#hero.run .puff.b{animation-delay:-.25s}
#hero.run .flame{width:96px;left:-136px}
#hero:not(.run) .hb{animation-name:hIdle}
#hero.run .hlg path{animation:hGal .36s ease-in-out infinite alternate}
#hero.run .hlg path+path{animation-delay:-.18s}
#hero.run .hlg.f path{animation-direction:alternate-reverse}
@keyframes hIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hBob{0%,100%{transform:translateY(0) rotate(5deg)}50%{transform:translateY(-4px) rotate(5deg)}}
@keyframes hLeg{0%,100%{transform:rotate(34deg)}50%{transform:rotate(-34deg)}}
@keyframes hDust{0%{opacity:.6;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-18px,-6px) scale(1.4)}}
@keyframes hPuff{0%{opacity:.7;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-30px,-14px) scale(1.8)}}
@keyframes hGal{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@keyframes hGb{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hHover{0%,100%{transform:translateY(-26px)}50%{transform:translateY(-34px)}}
@keyframes hVib{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes hFlame{from{transform:scaleX(.8) scaleY(.85)}to{transform:scaleX(1.12) scaleY(1.1)}}
@keyframes wSpin{to{transform:rotate(360deg)}}
@keyframes hPoof{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(1.8)}}
@keyframes hPw{0%{filter:brightness(3)}40%{transform:scale(1.25)}100%{filter:none;transform:none}}
@keyframes hMsg{0%{opacity:0;transform:translate(-50%,10px)}15%,70%{opacity:1;transform:translate(-50%,-14px)}100%{opacity:0;transform:translate(-50%,-40px)}}
#hint{position:absolute;left:700px;top:828px;font:700 15px var(--mono);color:#e2e8f0;white-space:nowrap;pointer-events:none;transition:opacity .4s;animation:hintB 1.2s steps(2) infinite}
#hint b{color:var(--era)}
#hint.off{animation:none;opacity:0}
@keyframes hintB{50%{opacity:.35}}

/* ---------- power-ups: a floating box on the road at each new year ---------- */
.pu{position:absolute;top:744px;width:0;height:0}
.pu .pub{position:absolute;left:-36px;top:0;width:72px;height:54px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 34%,#0b0f16),#0b0f16 80%);border:2px solid var(--c);box-shadow:0 0 26px color-mix(in srgb,var(--c) 55%,transparent);animation:puBob 1.6s ease-in-out infinite}
.pu .pub::after{content:"?";position:absolute;right:-9px;top:-11px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:900 14px var(--sans);color:#0b0f16;background:var(--c)}
.pu .pub svg{width:56px;height:34px;overflow:visible;--era:var(--c)}
.pu b{position:absolute;left:-70px;width:140px;top:62px;text-align:center;font:800 13px var(--mono);letter-spacing:.1em;color:var(--c);white-space:nowrap}
.pu.got .pub{animation:puGot .7s ease-out forwards}
.pu.got b{opacity:.25}
@keyframes puBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes puGot{0%{transform:translateY(0)}35%{transform:translateY(-34px) scale(1.15)}100%{transform:translateY(-60px) scale(.4);opacity:0}}

/* ---------- the cast: one NPC per logo / person, on the ground at its date ---------- */
.npc{position:absolute;top:872px;width:0;height:0;--vc:#94a3b8}
.npc>*{position:absolute}
.npc .nsh{left:-20px;top:-6px;width:40px;height:10px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.8),transparent 70%)}
.npc .nb{left:0;top:0;width:0;height:0}
.npc .nb>*{position:absolute}
.npc .nleg{bottom:1px;width:7px;height:15px;border-radius:3px 3px 4px 4px;background:#cbd5e1}
.npc .nleg.l{left:-9px}.npc .nleg.r{left:2px}
.npc .ntor{left:-13px;bottom:14px;width:26px;height:21px;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,var(--vc),color-mix(in srgb,var(--vc) 50%,#0b0f16))}
.npc .narm{bottom:18px;width:6px;height:17px;border-radius:3px;background:color-mix(in srgb,var(--vc) 70%,#fff);transform-origin:50% 3px;transition:transform .22s cubic-bezier(.3,1.7,.5,1)}
.npc .narm.l{left:-18px;transform:rotate(22deg)}.npc .narm.r{left:12px;transform:rotate(-22deg)}
.npc .nhd{left:-22px;bottom:33px;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#212a39,#0b0f16);border:2px solid color-mix(in srgb,var(--vc) 75%,#fff);box-shadow:0 0 18px color-mix(in srgb,var(--vc) 45%,transparent)}
.npc .nhd svg{width:27px;height:27px}
.npc .nhd.m{font:900 20px/1 var(--sans);color:#fff;background:var(--mc,#334155)}
.npc .nhd.avimg{border-radius:50%;width:50px;height:50px;left:-25px}
.npc .nfx{left:-58px;bottom:96px;width:64px;text-align:center;font:900 22px var(--sans);color:#fde68a;text-shadow:0 0 14px rgba(251,191,36,.9),0 2px 0 #000;opacity:0;white-space:nowrap}
.npc .nring{left:-40px;bottom:58px;width:30px;height:30px;border-radius:50%;border:3px solid #fde68a;opacity:0}
.npc .nck{left:14px;bottom:70px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:900 11px var(--sans);color:#0b0f16;background:#86efac;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.npc.red .ntor{background:linear-gradient(180deg,#f87171,#7f1d1d)}
.npc.on .nb{animation:nIdle 2.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
.npc.on .narm.r{animation:nWave 2.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
.npc.hi5 .nb{animation:nJump .7s cubic-bezier(.3,.8,.4,1)}
.npc.hi5 .narm.l{transform:rotate(158deg)}
.npc.hi5 .nfx{animation:nPop .9s ease-out}
.npc.hi5 .nring{animation:nRing .45s ease-out}
.npc.done .nck{transform:none}
@keyframes nIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes nWave{0%,70%,100%{transform:rotate(-22deg)}78%,92%{transform:rotate(-140deg)}85%{transform:rotate(-110deg)}}
@keyframes nJump{0%{transform:none}40%{transform:translateY(-26px)}100%{transform:none}}
@keyframes nPop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:translateY(-16px)}100%{opacity:0;transform:translateY(-30px)}}
@keyframes nRing{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(2.4)}}

/* ---------- actors: each event is someone doing their thing ----------
   hologram screen (the card scene) ← light cone ← speech bubble ← NPC on the road */
.blk.act{width:560px;display:flex;flex-direction:column;align-items:center;--lift:0px}
.act .ascr{position:relative;padding:8px;border-radius:20px;background:rgba(4,7,12,.5);border:1px solid color-mix(in srgb,var(--vc) 50%,transparent);box-shadow:0 0 44px color-mix(in srgb,var(--vc) 22%,transparent),0 24px 60px rgba(0,0,0,.45)}
.act .ascr::after{content:"";position:absolute;inset:8px;border-radius:16px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none}
.act .ascr::before{content:"";position:absolute;left:50%;top:-4px;width:60px;height:4px;margin-left:-30px;border-radius:2px;background:var(--vc);box-shadow:0 0 12px var(--vc)}
.act .vz{width:528px;margin:0}
.act .abeam{display:block;width:430px;height:calc(36px + var(--lift));flex:none;background:linear-gradient(0deg,color-mix(in srgb,var(--vc) 38%,transparent),color-mix(in srgb,var(--vc) 5%,transparent));clip-path:polygon(47% 100%,53% 100%,100% 0,0 0);opacity:.5}
/* comic speech bubble: light, sized to what the character says */
.act{--bb:color-mix(in srgb,var(--vc) 12%,#eef2f7)}
.act.red{--bb:#ffe1e3}.act.dsx{--bb:#e1e6ff}
.act .abub{position:relative;width:max-content;min-width:190px;max-width:328px;flex:none;padding:11px 16px 12px;border-radius:22px;background:var(--bb);color:#0b0f16;box-shadow:0 0 0 3px color-mix(in srgb,var(--vc) 60%,transparent),0 14px 30px rgba(0,0,0,.5)}
.act .abub::after{content:"";position:absolute;left:50%;bottom:-11px;width:22px;height:14px;margin-left:-11px;background:var(--bb);clip-path:polygon(0 0,100% 0,40% 100%)}
.act .abh{font-size:21px;font-weight:850;line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act .abm{display:flex;align-items:center;gap:8px;margin-top:4px}
.act .abm em{font:800 13px var(--mono);font-style:normal;color:color-mix(in srgb,var(--vc) 60%,#0b0f16)}
.act .abm .tcat{color:color-mix(in srgb,var(--tc) 55%,#0b0f16);background:color-mix(in srgb,var(--tc) 18%,transparent)}
.act .abub p{margin-top:4px;font-size:15px;line-height:1.42;color:#374151;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.act .abub p .dm,.act .abub p .mut{color:#6b7280}

/* ---------- gates: month heads and labels become signs on posts over the road ---------- */
.blk.gate{--gc:var(--ac)}
#L2 .blk.gate .mo.head{background:linear-gradient(180deg,rgba(12,30,26,.95),rgba(7,12,15,.95))!important;border:2px solid color-mix(in srgb,var(--gc) 70%,transparent)!important;box-shadow:0 0 0 6px rgba(0,0,0,.3),0 0 70px color-mix(in srgb,var(--gc) 26%,transparent)!important}
.blk.gate.lbl{width:max-content;max-width:1000px;padding:24px 34px;border-radius:22px;background:linear-gradient(180deg,rgba(18,24,35,.95),rgba(9,12,18,.95));border:2px solid color-mix(in srgb,var(--gc) 60%,transparent);box-shadow:0 0 60px color-mix(in srgb,var(--gc) 20%,transparent)}
.blk.gate.lbl h3{font-size:54px}
.gpost{position:absolute;top:100%;width:12px;height:var(--post,300px);border-radius:3px;background:linear-gradient(90deg,#1b222d,#6b7a90 45%,#1b222d);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.gpost.l{left:70px}.gpost.r{right:70px}
.gpost::after{content:"";position:absolute;left:-6px;bottom:-4px;width:24px;height:8px;border-radius:3px;background:#2a3342}
/* posts follow the period: lacquered wood · riveted iron · steel · light */
.blk.gate[data-sty=a] .gpost{background:linear-gradient(90deg,#3f0d0d,#b91c1c 45%,#3f0d0d)}
.blk.gate[data-sty=a] .gpost::after{background:#57301a}
.blk.gate[data-sty=b] .gpost{background:repeating-linear-gradient(180deg,transparent 0 22px,rgba(0,0,0,.5) 22px 25px),linear-gradient(90deg,#1c1917,#78716c 45%,#1c1917)}
.blk.gate[data-sty=d] .gpost{width:6px;margin-left:3px;border-radius:3px;background:linear-gradient(180deg,var(--gc),color-mix(in srgb,var(--gc) 8%,transparent));box-shadow:0 0 14px var(--gc)}
.blk.gate[data-sty=d] .gpost::after{left:-9px;background:color-mix(in srgb,var(--gc) 40%,#0b0f16)}

/* ---------- 热议 弹幕: flies across the sky when the hero reaches its week ---------- */
#sky{position:absolute;left:0;top:72px;width:1920px;height:80px;overflow:hidden;pointer-events:none}
.skd{position:absolute;left:0;top:0;display:flex;align-items:center;gap:9px;padding:5px 15px;border-radius:999px;background:rgba(48,14,36,.8);border:1px solid rgba(244,114,182,.5);font:700 18px var(--sans);color:#fde7f3;white-space:nowrap;will-change:transform;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.skd:not(.fly){display:none}
.skd i{font:800 11px var(--mono);font-style:normal;letter-spacing:.14em;color:#f472b6}
.skd em{font:600 12px var(--mono);font-style:normal;color:#f9a8d4;opacity:.8}
.skd.ds{background:rgba(20,26,66,.82);border-color:rgba(107,132,255,.55);color:#dbe2ff}
.skd.ds i,.skd.ds em{color:#a5b4fc}

/* ---------- concept 弹幕 (replaces the word cloud) ---------- */
/* flies over the whole stage, between the chapter title and the road */
#cdm{position:absolute;left:0;top:222px;width:1920px;height:580px;overflow:hidden;pointer-events:none;opacity:0;visibility:hidden}
#cdm .dmw{pointer-events:auto}
.cdtip{position:absolute;left:0;top:0;z-index:4;max-width:560px;padding:12px 16px 13px;border-radius:14px;background:rgba(7,9,13,.94);border:1px solid color-mix(in srgb,var(--cc,#22d3ee) 60%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--cc,#22d3ee) 25%,transparent),0 14px 30px rgba(0,0,0,.5);pointer-events:none;opacity:0;transition:opacity .15s}
.cdtip.on{opacity:1}
.cdtip b{display:block;font:850 20px var(--sans);color:var(--cc,#fff)}
.cdtip span{display:block;margin-top:4px;font:500 16px/1.45 var(--sans);color:#cbd5e1}
.cdtip em{display:block;margin-top:6px;font:600 12px var(--mono);font-style:normal;color:#6b7487}
.cdl{display:flex;gap:16px;margin-top:12px;font:700 15px var(--mono)}
.cdl span{display:flex;align-items:center;gap:6px}
.cdl i{width:10px;height:10px;border-radius:3px;background:currentColor}
.dmw{position:absolute;left:0;top:0;display:none;white-space:nowrap;line-height:1;cursor:pointer;color:var(--cc);font-weight:var(--fw);letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 10px rgba(0,0,0,.9);will-change:transform}
.dmw.fly{display:block}
.dmw.hot{padding:4px 14px 8px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--cc) 60%,transparent);background:color-mix(in srgb,var(--cc) 12%,rgba(0,0,0,.45))}
.dmw:hover{z-index:3;text-shadow:0 0 18px var(--cc);outline:2px solid color-mix(in srgb,var(--cc) 70%,transparent);outline-offset:4px;border-radius:8px}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;width:1920px;height:66px;display:flex;align-items:center;gap:38px;padding:0 64px;background:linear-gradient(180deg,rgba(5,7,11,.95),rgba(5,7,11,.72) 70%,rgba(5,7,11,0));pointer-events:none}
#hud>div{display:flex;flex-direction:column;justify-content:center;white-space:nowrap}
#hud small{font:700 11px var(--mono);letter-spacing:.2em;color:#5b6375;text-transform:uppercase}
#hud b{font:800 22px/1.15 var(--mono);color:#fff;letter-spacing:.01em}
#hud em{font:600 14px var(--mono);font-style:normal;color:#5b6375;margin-left:3px}
#hud .hwd b{color:var(--era)}
#hud .hwd span{font:700 16px var(--sans);color:#cbd5e1;margin-left:10px}
#hud .htm b{font-size:28px;color:var(--era);min-width:156px}
#hud .hro b{font-family:var(--sans);font-size:22px}
#hud .sp{flex:1}
#hud .coin{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;border-radius:50%;vertical-align:2px;background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 60%,#b45309);color:#7c2d12;font:900 12px var(--sans);font-style:normal;box-shadow:0 0 10px rgba(251,191,36,.5);animation:coinSpin 3s ease-in-out infinite}
@keyframes coinSpin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
#hud .hand{width:21px;height:21px;margin-right:7px;vertical-align:-3px;fill:none;stroke:#fde68a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hud .hp{display:inline-block;width:92px;height:8px;margin-left:10px;border-radius:4px;vertical-align:3px;background:rgba(255,255,255,.1);overflow:hidden}
#hud .hp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#a3e635);transition:width .3s}
#hud .lnk{flex-direction:row;gap:16px;pointer-events:auto}
#hud .lnk a{font:600 14px var(--mono);color:#8b93a7;text-decoration:none;border-bottom:1px solid rgba(148,163,184,.35)}
#hud .lnk a:hover{color:#fff}
#toast{position:absolute;left:50%;top:160px;transform:translate(-50%,-10px);padding:12px 30px 14px;border-radius:16px;background:rgba(7,9,13,.88);border:1px solid color-mix(in srgb,var(--era) 60%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--era) 30%,transparent);text-align:center;opacity:0;pointer-events:none}
#toast.show{animation:toast 2.4s ease both}
#toast small{display:block;font:800 13px var(--mono);letter-spacing:.32em;color:var(--era)}
#toast b{display:block;font:850 34px var(--sans);margin-top:4px;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}12%,78%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}

/* ---------- minimap + autoplay ---------- */
#mm{position:absolute;left:100px;top:1012px;width:1380px;height:54px;cursor:pointer;touch-action:none}
#mm .mt,#mm .mf{position:absolute;left:0;right:0;top:34px;height:6px;border-radius:3px}
#mm .mt{opacity:.2}
#mm .mv{position:absolute;top:26px;height:22px;border-radius:6px;border:2px solid var(--era);background:rgba(255,255,255,.05);box-shadow:0 0 14px color-mix(in srgb,var(--era) 45%,transparent);pointer-events:none}
#mm .mh{position:absolute;top:22px;width:0;height:30px;border-left:2px solid #fff;pointer-events:none}
#mm .ml button{position:absolute;top:0;font:700 13px var(--mono);color:var(--dim);background:none;border:none;border-left:1px solid rgba(255,255,255,.22);padding:2px 0 2px 6px;cursor:pointer;white-space:nowrap}
#mm .ml button.on{color:var(--ch)}
#mm .ml button:hover{color:#fff}
#stage #auto{position:absolute;left:auto;right:96px;bottom:14px;transform:none;opacity:.7}
#stage #auto:hover,#stage #auto.on{opacity:1}
#auto .ahint{display:none}

/* ---------- horizontal re-staging of the retro charts ---------- */
/* 关键词迁移: ascending platforms */
.hplat{position:absolute;height:16px;border-radius:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--nc) 80%,#fff),color-mix(in srgb,var(--nc) 45%,#0b0f16));box-shadow:0 0 22px color-mix(in srgb,var(--nc) 45%,transparent),0 10px 0 rgba(0,0,0,.35);transition:box-shadow .35s}
.hplat.hit{box-shadow:0 0 46px var(--nc),0 10px 0 rgba(0,0,0,.35)}
.hplat time{position:absolute;left:2px;top:26px;font:700 15px var(--mono);color:var(--nc)}
.hpcard{position:absolute;padding:12px 14px;border-radius:14px;border-left:3px solid var(--nc)!important;transition:box-shadow .35s}
.hpcard.hit{box-shadow:0 0 0 1px var(--nc),0 0 34px color-mix(in srgb,var(--nc) 40%,transparent),0 24px 60px rgba(0,0,0,.35)!important}
.hpcard b{display:block;font-size:23px;font-weight:850;line-height:1.15}
.hpcard span{display:block;font-size:15px;color:var(--mut);margin-top:4px}
.hpcard span.tag{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:999px;font:700 12px var(--mono);color:var(--nc);background:color-mix(in srgb,var(--nc) 14%,#0b0f16);border:1px solid color-mix(in srgb,var(--nc) 45%,transparent)}
.hpax{position:absolute;font:700 14px var(--mono);letter-spacing:.14em;color:var(--dim)}
.hpax.lo{left:0;bottom:-6px}.hpax.hi{right:0;top:0}
/* SWE-bench: pipes */
.hsb{position:absolute;width:80px;border-radius:6px 6px 2px 2px;background:linear-gradient(0deg,color-mix(in srgb,var(--c) 14%,transparent),color-mix(in srgb,var(--c) 85%,transparent));transform-origin:bottom;box-shadow:0 0 28px color-mix(in srgb,var(--c) 30%,transparent);transition:box-shadow .35s}
.hsb::before{content:"";position:absolute;left:-7px;right:-7px;top:0;height:16px;border-radius:6px;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.hsb.hit{box-shadow:0 0 50px color-mix(in srgb,var(--c) 70%,transparent)}
.hsv{position:absolute;width:120px;text-align:center;font:900 30px var(--sans);letter-spacing:-.02em}
.hsl{position:absolute;width:138px;text-align:center}
.hsl b{display:block;font-size:16px;margin-top:4px;white-space:nowrap}
.hsl em{display:block;font:600 13px var(--mono);color:var(--dim);font-style:normal}
.hsg{position:absolute;left:40px;right:0;height:0;border-top:1px dashed rgba(255,255,255,.08)}
.hsg b{position:absolute;left:-40px;top:-10px;font:700 13px var(--mono);color:var(--dim)}
.hsend{position:absolute;width:170px;border-left:2px dashed rgba(255,255,255,.3);padding-left:12px;font-size:15px;line-height:1.45;color:var(--mut)}
.hsend b{display:block;font:800 15px var(--mono);color:#fff}
/* 记忆: five steps to the right */
.vstep.hms{width:322px;transition:box-shadow .35s}
.vstep.hms.hit{box-shadow:0 0 0 1px var(--mc),0 0 36px color-mix(in srgb,var(--mc) 40%,transparent)!important}
.hmarr{position:absolute;font:900 36px var(--sans);font-style:normal;opacity:.8}
/* 代价: three swim lanes */
.hct{position:absolute;top:0;width:0;border-left:1px dashed rgba(255,255,255,.08)}
.hct b{position:absolute;left:6px;top:4px;font:600 14px var(--mono);color:var(--dim);white-space:nowrap}
.hct.y b{color:#fff;font-weight:800}
.hcl{position:absolute;left:0;width:176px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;background:color-mix(in srgb,var(--lc) 10%,#0b0f16);border:1px solid color-mix(in srgb,var(--lc) 35%,transparent)}
.hcl b{font-size:28px;font-weight:900;color:var(--lc);line-height:1.15}
.hcl small{display:block;font:600 13px var(--mono);color:var(--mut)}
.hcr{position:absolute;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--lc) 6%,transparent),transparent);border-top:1px solid color-mix(in srgb,var(--lc) 18%,transparent)}
.cv.hcv{width:296px;transition:box-shadow .35s}
.cv.hcv span{display:block;margin:2px 0 0}
.cv.hcv.hit{box-shadow:0 0 0 1px var(--lc),0 0 30px color-mix(in srgb,var(--lc) 45%,transparent)!important}
/* HTalk 旅程: a row of stops */
.jstep.hj{flex-direction:column;align-items:flex-start;width:270px;gap:14px}
.jstep.hj i{transition:transform .3s,box-shadow .3s}
.jstep.hj.hit i{transform:scale(1.08);box-shadow:0 0 40px rgba(224,179,84,.75)}
/* 生命线 */
.lgy{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed rgba(255,255,255,.1)}
.lgy b{position:absolute;left:8px;top:4px;font:800 22px var(--mono);white-space:nowrap}
.lgy.now{border-left:2px dashed rgba(255,255,255,.5)}
.lgy.now b{color:#fff;font-size:16px;top:8px}
.lrow{position:absolute;left:0;right:0;height:29px}
.lnm{position:absolute;margin-top:3px;font:700 16px var(--sans);color:var(--lc);white-space:nowrap;text-align:right;filter:saturate(.35) brightness(.8);transition:filter .35s}
.lnm.hit{filter:none}
.lnm small{font:600 12px var(--mono);color:var(--mut);margin-left:8px}
.lbar{position:absolute;top:11px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--lc),color-mix(in srgb,var(--lc) 40%,transparent))}
.lbar.alive{background:linear-gradient(90deg,color-mix(in srgb,var(--lc) 45%,transparent),var(--lc));box-shadow:0 0 12px color-mix(in srgb,var(--lc) 55%,transparent)}
.ldot{position:absolute;top:7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--lc);box-shadow:0 0 12px var(--lc)}
.lend{position:absolute;top:5px;width:3px;height:18px;margin-left:-1px;background:var(--lc)}
.lfut{position:absolute;top:13px;height:0;border-top:2px dashed var(--lc)}
.lnote{position:absolute;top:5px;font:600 13px var(--mono);color:#cbd5e1;white-space:nowrap}
.lnote.alive{color:var(--lc)}
.ltag{position:absolute;top:4px;transform:translateX(-50%);font:800 12px var(--mono);color:#0b0f16;background:var(--lc);padding:1px 5px;border-radius:5px}
/* wide posters that were tall in the vertical scroll get re-flowed sideways */
#b-fork{width:1990px!important}
#b-fork .fk{display:grid;grid-template-columns:1360px 570px;column-gap:60px;align-items:start}
#b-fork .fknode{grid-column:1;grid-row:1}
#b-fork .fkcols{grid-column:1;grid-row:2}
#b-fork .fkbar{grid-column:2;grid-row:1/span 2;align-self:start;margin-top:34px}
#b-fork .fkkick{grid-column:2;grid-row:1/span 2;align-self:end;text-align:left;margin:0 0 6px}
</style>
</head>
<body>
<div id="stage">
<div class="layer" id="L0" data-s=".22"></div>
<div class="layer" id="L1" data-s=".5"></div>
<div id="gbg"></div>
<div class="layer" id="LG" data-s="1"></div>
<div id="nowl"></div>
<div class="layer" id="L2" data-s="1">
<!--STORY_BLOCKS-->

 if(put('E',UI.E,String(ec))&&booted)bump(UI.E);if(put('B',UI.B,String(bc))&&booted)bump(UI.B);
 /* HUD: world, time, role, valuation, best SWE score */
 const nowB=byId('b-now'),mN=mf(NOW),m=Minv(S);let era='all',label='START';
 if(m!==null&&S<=nowB.left+60){era=eraOf(m);label=mlabel(m)}
 else if(m!==null){const cb=[...BL].reverse().find(b=>b.left<=S+40)||nowB;era=cb.era;label=era==='ht'?'附 · HTalk':'回望';
  if(cb.hax){const lx=(S-cb.left)/cb.sc-cb.hax.x0;if(lx>=0&&lx<=cb.hax.w)label='回望 · '+mlabel(cb.hax.m0+lx/cb.hax.px)}}
 const me=m===null?-1:Math.min(m,mN);
 let role='—';for(const r of ROLES)if(mf(r[0])<=me+.01)role=r[1];
 let val='—';for(const v of VALS)if(v[0]<=me+.01)val=v[1];
 let swe=null;for(const r of SWE)if(mf(r.d)<=me+.01)swe=swe===null?r.v:Math.max(swe,r.v);
 const col=ERA[era]||ERA.all;if(put('era',null,col))UI.head.style.setProperty('--era',col);
 put('T',UI.T,label);put('R',UI.R,role);if(put('C',UI.C,val)&&booted)bump(UI.C);
 if(put('S',UI.S,swe===null?'—':(swe%1?swe.toFixed(1):String(swe))+'%')&&booted)bump(UI.S);put('Sb',UI.Sb,(swe||0)+'%','width');
 let wi=-1;for(let i=0;i<WORLDS.length;i++)if(S+520>=WORLDS[i].b.left)wi=i;
 if(put('wi',null,wi)){const w=WORLDS[wi];UI.W.textContent=w?w.k:'START';UI.Wn.textContent=w?w.n:'Vibe Coding 简史';
  if(w&&booted&&smooth)toast(w);
  UI.mm.querySelectorAll('.ml button').forEach(x=>x.classList.toggle('on',!!w&&x.dataset.b===w.b.id))}
 let ri=-1;ROLES.forEach((r,i)=>{if(mf(r[0])<=me+.01)ri=i});
 if(put('ri',null,ri))document.querySelectorAll('#L1 .hrole').forEach(e=>e.classList.toggle('on',+e.dataset.r===ri));
 /* minimap */
 const pr=clamp(S/SMAX);put('mh',MMH,(pr*100).toFixed(2)+'%','left');put('mf',MMF,'inset(0 '+((1-pr)*100).toFixed(2)+'% 0 0)','clipPath');
 put('mvl',MMV,(clamp((S-F)/SMAX)*100).toFixed(2)+'%','left');put('mvw',MMV,((clamp((S-F+1920)/SMAX)-clamp((S-F)/SMAX))*100).toFixed(2)+'%','width');
 const cb=[...BL].reverse().find(b=>b.left<=S+300);if(cb&&cb!==curB){curB=cb;history.replaceState(null,'','#'+cb.id.slice(2))}}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>update())}},{passive:true});
addEventListener('resize',()=>{const S=lastS;fit();toS(S);update(true)});
stage.addEventListener('scroll',()=>{if(stage.scrollTop||stage.scrollLeft){stage.scrollTop=0;stage.scrollLeft=0}});

/* ---------- navigation ---------- */
function toS(S,smooth){scrollTo({top:clamp(S,0,SMAX)*K/M,behavior:smooth?'smooth':'instant'})}
function goB(id,inst){const b=byId(id);if(b)toS(b.kind==='act'?b.npcX-260:b.left+F-140,!inst)}
const SPEEDS=[.25,.5,.75,1,1.5,2,3,4],BASE=160;let playing=false,si=3,apS=0,apT=0;
const qs=new URLSearchParams(location.search);if(qs.get('speed')){const v=+qs.get('speed');let bi=0;SPEEDS.forEach((x,i)=>{if(Math.abs(x-v)<Math.abs(SPEEDS[bi]-v))bi=i});si=bi}
function showSpeed(){$('#asr').value=si;$('#aso').textContent=SPEEDS[si]+'×'}
function setSpeed(i){si=clamp(i,0,SPEEDS.length-1);showSpeed()}
function play(on){playing=on;$('#auto').classList.toggle('on',on);$('#apl').textContent=on?'❚❚':'▶';
 if(on){if(curS()>=SMAX-2)toS(0);apS=curS();apT=performance.now();requestAnimationFrame(step)}}
function step(t){if(!playing)return;const dt=Math.min(.1,(t-apT)/1000);apT=t;apS+=BASE*SPEEDS[si]*dt;if(apS>=SMAX){toS(SMAX);play(false);return}toS(apS);requestAnimationFrame(step)}
const stopAuto=()=>{if(playing)play(false)};
$('#apl').onclick=()=>play(!playing);$('#asl').onclick=()=>setSpeed(si-1);$('#asf').onclick=()=>setSpeed(si+1);$('#asr').oninput=e=>setSpeed(+e.target.value);
$('#auto').addEventListener('keydown',e=>e.stopPropagation());
showSpeed();
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;const S=curS();
 if(e.key===' '){e.preventDefault();play(!playing);return}
 if(e.key==='+'||e.key==='='){setSpeed(si+1);return}if(e.key==='-'||e.key==='_'){setSpeed(si-1);return}
 if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();stopAuto();const n=NAV.find(x=>x.s>S+20);if(n)toS(n.s,true)}
 else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();stopAuto();const n=[...NAV].reverse().find(x=>x.s<S-20);toS(n?n.s:0,true)}
 else if(e.key==='Home'){e.preventDefault();stopAuto();toS(0,true)}else if(e.key==='End'){e.preventDefault();stopAuto();toS(SMAX,true)}});
/* trackpads and shift+wheel scroll sideways: route them to the same axis */
addEventListener('wheel',e=>{stopAuto();if(e.ctrlKey)return;const k=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1,ax=Math.abs(e.deltaX),ay=Math.abs(e.deltaY);
 if(ax>ay){e.preventDefault();scrollBy(0,e.deltaX*k)}else if(e.shiftKey&&ay>0){e.preventDefault();scrollBy(0,e.deltaY*k)}},{passive:false});
let tX=null,tY=null;
addEventListener('touchstart',e=>{if(!e.target.closest('#auto'))stopAuto();tX=e.touches[0].clientX;tY=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(tX===null)return;const x=e.touches[0].clientX,y=e.touches[0].clientY,dx=x-tX,dy=y-tY;if(Math.abs(dx)>Math.abs(dy)){e.preventDefault();scrollBy(0,-dx/M)}tX=x;tY=y},{passive:false});
addEventListener('touchend',()=>{tX=tY=null},{passive:true});
document.addEventListener('click',e=>{const w=e.target.closest('[data-jump],[data-go]');if(w){const j=JUMP[w.dataset.jump||w.dataset.go];if(j)goB(j)}});
let mdrag=false;const mmT=UI.mm.querySelector('.mt');
const mmTo=cx=>{const r=mmT.getBoundingClientRect();toS(clamp((cx-r.left)/r.width)*SMAX)};
UI.mm.addEventListener('pointerdown',e=>{stopAuto();const b=e.target.closest('button[data-b]');if(b){goB(b.dataset.b);return}mdrag=true;UI.mm.setPointerCapture(e.pointerId);mmTo(e.clientX)});
UI.mm.addEventListener('pointermove',e=>{if(mdrag)mmTo(e.clientX)});
UI.mm.addEventListener('pointerup',()=>{mdrag=false});

if('scrollRestoration' in history)history.scrollRestoration='manual';
collect();layout();update(true);
(function(){const h=location.hash.slice(1);if(h&&byId('b-'+h))goB('b-'+h,true);update(true);booted=true})();
if(qs.get('auto')==='1')setTimeout(()=>play(true),600);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{const S=curS(),bt=booted;booted=false;layout();toS(S);update(true);booted=bt});
window.BL=BL;window.goB=goB;window.SMAX_=()=>SMAX;window.K_=()=>K;window.M_=M;window.F_=F;
</script>
